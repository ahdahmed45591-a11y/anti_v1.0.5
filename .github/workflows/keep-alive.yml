name: Render Keep-Alive

on:
  schedule:
    # Ping le backend toutes les 5 minutes pour empecher la mise en veille Render
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping Backend Health
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          curl -sf --max-time 30 https://baou-finance-backend.onrender.com/health || echo "Ping failed or sleeping"
          curl -sf --max-time 30 https://baou-finance-backend.onrender.com/api/stocks || true
