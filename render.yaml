# Render Blueprint configuration for BAOU Finance (Django + PostgreSQL)
services:
  - type: web
    name: baou-finance-backend
    runtime: python
    rootDir: backend_django
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && python manage.py seed && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: baou-finance-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://admin-six-beta-23.vercel.app"
      - key: EMAIL_HOST_USER
        value: "baoufinance@gmail.com"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_HOST_PASSWORD
        value: "htcqixyzoybunpig"

databases:
  - name: baou-finance-db
    databaseName: baou
    user: baou
    plan: free
